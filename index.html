<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netease Player - Web Console</title>
<style>
  :root {
    --bg: #0a0a0a;
    --bg-2: #0d1117;
    --surface: #161b22;
    --surface-2: #1a1a2e;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --accent: #00d4aa;
    --success: #3fb950;
    --error: #f85149;
    --warn: #d29922;
    --blue: #58a6ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: "JetBrains Mono", "Fira Code", "SF Mono", "Monaco", "Consolas", monospace; font-size: 14px; }
  body {
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
    color: var(--text);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .scanlines {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.02),
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 2px
    );
    z-index: 1;
  }

  .header {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid #21262d;
    flex-shrink: 0;
  }

  .header .title {
    font-size: 14px;
    font-weight: 500;
    color: var(--blue);
  }

  .header .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }

  .header .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }

  .header .status-dot.online { background: var(--success); }
  .header .status-dot.offline { background: var(--error); }
  .header .status-dot.loading { background: var(--warn); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .toolbar {
    position: relative;
    z-index: 2;
    display: flex;
    gap: 6px;
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 1px solid #21262d;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .toolbar-btn {
    background: var(--surface-2);
    border: 1px solid #30363d;
    color: var(--text);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .toolbar-btn:hover {
    background: var(--blue);
    border-color: var(--blue);
  }

  .output {
    position: relative;
    z-index: 2;
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .output .line {
    font-family: inherit;
    font-size: 13px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .output .line.cmd { color: var(--blue); }
  .output .line.success { color: var(--success); }
  .output .line.error { color: var(--error); }
  .output .line.warn { color: var(--warn); }
  .output .line.info { color: var(--text-muted); }
  .output .line.prompt { color: var(--accent); }

  .output .prompt::after {
    content: " ";
    animation: blink 1s infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .input-area {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    background: var(--surface);
    border-top: 1px solid #21262d;
    flex-shrink: 0;
  }

  .input-area .prompt-char {
    color: var(--accent);
    font-weight: bold;
    font-size: 16px;
  }

  .input-area input {
    flex: 1;
    background: var(--bg);
    border: 1px solid #30363d;
    color: var(--text);
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }

  .input-area input:focus {
    border-color: var(--accent);
  }

  .input-area input::placeholder {
    color: var(--text-muted);
  }

  .input-area .btn {
    background: var(--accent);
    border: none;
    color: var(--bg);
    padding: 6px 16px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
    transition: opacity 0.15s;
  }

  .input-area .btn:hover { opacity: 0.9; }

  .input-area .btn.loading {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .output::-webkit-scrollbar {
    width: 8px;
  }

  .output::-webkit-scrollbar-track {
    background: var(--bg);
  }

  .output::-webkit-scrollbar-thumb {
    background: #30363d;
    border-radius: 4px;
  }

  .output::-webkit-scrollbar-thumb:hover {
    background: var(--blue);
  }
</style>
</head>
<body>
  <div class="scanlines"></div>

  <div class="header">
    <span class="title">netease-player</span>
    <span class="status">
      <span class="status-dot loading" id="statusDot"></span>
      <span id="statusText">检测中...</span>
    </span>
  </div>

  <div class="toolbar">
    <button class="toolbar-btn" data-cmd="status">状态</button>
    <button class="toolbar-btn" data-cmd="search 晴天">搜索 晴天</button>
    <button class="toolbar-btn" data-cmd="stats-search 周杰伦">统计 周杰伦</button>
    <button class="toolbar-btn" data-cmd="daily">每日推荐</button>
    <button class="toolbar-btn" data-cmd="stats-search 周杰伦 --play-n 3">连播3首</button>
    <button class="toolbar-btn" data-cmd="stats-search 周杰伦 --play-min 5">连播5分</button>
  </div>

  <div class="output" id="output"></div>

  <div class="input-area">
    <span class="prompt-char">$</span>
    <input id="cmdInput" placeholder="输入命令，如: search 周杰伦 | login -p 13800138000 -P 密码">
    <button class="btn" id="execBtn">执行</button>
  </div>

<script>
const output = document.getElementById("output")
const input = document.getElementById("cmdInput")
const execBtn = document.getElementById("execBtn")
const statusDot = document.getElementById("statusDot")
const statusText = document.getElementById("statusText")

function append(text, cls) {
  const line = document.createElement("div")
  line.className = "line " + (cls || "")
  line.textContent = text
  output.appendChild(line)
  output.scrollTop = output.scrollHeight
}

function clearOutput() {
  output.innerHTML = ""
}

function addWelcome() {
  append("Netease Player Web Console v1.0", "info")
  append("输入 'help' 查看命令列表，或点击上方按钮快速操作", "info")
  append("---", "info")
}

function exec(cmd) {
  if (execBtn.classList.contains("loading")) return
  const c = cmd || input.value.trim()
  if (!c) return

  execBtn.classList.add("loading")
  append("$ " + c, "cmd")

  fetch("/api/exec", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({cmd: c}),
  })
  .then(r => r.json())
  .then(data => {
    const cls = data.success ? "success" : "error"
    const lines = (data.output || "").split("\n")
    lines.forEach(l => append(l, cls))
    append("---", "info")
  })
  .catch(err => {
    append("网络错误: " + err.message, "error")
    append("---", "info")
  })
  .finally(() => {
    execBtn.classList.remove("loading")
    if (!cmd) input.value = ""
    input.focus()
    checkStatus()
  })
}

function checkStatus() {
  fetch("/api/status")
  .then(r => r.json())
  .then(data => {
    if (data.logged_in) {
      statusDot.className = "status-dot online"
      statusText.textContent = "已登录"
    } else {
      statusDot.className = "status-dot offline"
      statusText.textContent = "未登录"
    }
  })
  .catch(() => {
    statusDot.className = "status-dot loading"
    statusText.textContent = "离线"
  })
}

document.getElementById("execBtn").addEventListener("click", () => exec())
input.addEventListener("keydown", e => { if (e.key === "Enter") exec() })

document.querySelectorAll(".toolbar-btn").forEach(btn => {
  btn.addEventListener("click", () => exec(btn.dataset.cmd))
})

// Help content
const helpText = `
常用命令:
  login -p <手机号> -P <密码>    手机号密码登录
  login --qr                       二维码登录（请在终端执行）
  status                           查看登录状态
  search <关键词>                  搜索歌曲
  play --id <歌曲ID>               播放指定歌曲
  playlist                         浏览歌单
  daily                            每日推荐
  stats-search <关键词>            歌手统计
  stats-search <关键词> --play-n N 连播 N 首
  stats-search <关键词> --play-min M 连播 M 分钟
`.trim()

// Show help on first load for 3 seconds
addWelcome()
checkStatus()
</script>
</body>
</html>
