<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netease Player - Web Console</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"SF Mono","Fira Code","Menlo","Consolas",monospace;
    background:#0a0a0a;color:#c9d1d9;height:100vh;display:flex;flex-direction:column;
  }
  .header{
    background:#161b22;border-bottom:1px solid #21262d;padding:10px 20px;
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  }
  .header h1{font-size:15px;color:#58a6ff;font-weight:normal;}
  .status{font-size:13px;}
  .status-ok{color:#3fb950}.status-no{color:#f85149}.status-pending{color:#d29922}
  .controls{
    padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;
    background:#0d1117;border-bottom:1px solid #21262d;
  }
  .btn{
    background:#21262d;border:1px solid #30363d;color:#c9d1d9;
    padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;
    transition:background .15s;
  }
  .btn:hover{background:#30363d;border-color:#58a6ff}
  .btn.accent{background:#1f6feb;border-color:#1f6feb;color:#fff}
  .btn.accent:hover{background:#388bfd}
  .btn.danger{background:#da3633;border-color:#da3633;color:#fff}
  .btn.danger:hover{background:#f85149}
  .output{
    flex:1;overflow-y:auto;padding:16px 20px;font-size:13px;line-height:1.7;
    background:#0a0a0a;white-space:pre-wrap;word-break:break-all;
  }
  .output .line{margin-bottom:2px}
  .output .cmd-line{color:#58a6ff}
  .output .success{color:#3fb950}
  .output .error{color:#f85149}
  .output .info{color:#8b949e}
  .output .warn{color:#d29922}
  .input-area{
    display:flex;gap:8px;padding:10px 20px;background:#161b22;
    border-top:1px solid #21262d;flex-shrink:0;
  }
  .input-area input{
    flex:1;background:#0d1117;border:1px solid #30363d;color:#c9d1d9;
    padding:8px 12px;border-radius:6px;font-size:13px;font-family:inherit;outline:none;
  }
  .input-area input:focus{border-color:#58a6ff}
  .input-area input::placeholder{color:#484f58}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="header">
  <h1>/ netease-player</h1>
  <div class="status" id="status">检测中...</div>
</div>

<div class="controls">
  <button class="btn" onclick="exec('status')">登录状态</button>
  <button class="btn" onclick="exec('search 晴天')">搜索晴天</button>
  <button class="btn" onclick="exec('stats-search 周杰伦')">周杰伦统计</button>
  <button class="btn" onclick="exec('daily')">每日推荐</button>
  <button class="btn" onclick="exec('stats-search 周杰伦 --play-n 3')">周杰伦 播3首</button>
  <button class="btn" onclick="exec('stats-search 周杰伦 --play-min 5')">周杰伦 播5分</button>
</div>

<div class="output" id="output">
  <div class="line info">Netease Player Web Console v1.0</div>
  <div class="line info">在下方输入框输入命令，或点击上方快捷按钮</div>
  <div class="line info">---</div>
</div>

<div class="input-area">
  <span style="color:#58a6ff;line-height:36px;font-size:14px">$</span>
  <input id="cmdInput" placeholder="输入命令，如: search 周杰伦" onkeydown="if(event.key==='Enter')exec()">
  <button class="btn accent" onclick="exec()">执行</button>
</div>

<script>
const output = document.getElementById("output")
const input = document.getElementById("cmdInput")
const statusEl = document.getElementById("status")
let busy = false

function append(text, cls) {
  const d = document.createElement("div")
  d.className = "line " + (cls || "")
  d.textContent = text
  output.appendChild(d)
  output.scrollTop = output.scrollHeight
}

function exec(cmd) {
  if (busy) return
  const c = cmd || input.value.trim()
  if (!c) return

  busy = true
  input.disabled = true
  append("$ " + c, "cmd-line")
  append("  running...", "warn")

  fetch("/api/exec", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({cmd: c}),
  })
  .then(r => r.json())
  .then(data => {
    // Remove the "running..." line
    output.lastChild.remove()
    const cls = data.success ? "success" : "error"
    const lines = (data.output || "").split("\n")
    lines.forEach(l => append(l, cls))
    append("---", "info")
    if (!cmd) input.value = ""
    busy = false
    input.disabled = false
    input.focus()
    checkStatus()
  })
  .catch(err => {
    output.lastChild.remove()
    append("网络错误: " + err.message, "error")
    append("---", "info")
    busy = false
    input.disabled = false
    input.focus()
  })
}

function checkStatus() {
  fetch("/api/status")
  .then(r => r.json())
  .then(data => {
    if (data.logged_in) {
      statusEl.className = "status status-ok"
      statusEl.textContent = "已登录"
    } else {
      statusEl.className = "status status-no"
      statusEl.textContent = "未登录"
    }
  })
  .catch(() => {
    statusEl.className = "status status-pending"
    statusEl.textContent = "离线"
  })
}

checkStatus()
input.focus()
</script>
</body>
</html>
