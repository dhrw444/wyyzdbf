<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多账号任务执行平台</title>
<style>
  :root {
    --spotify-green: #1DB954;
    --spotify-black: #121212;
    --spotify-dark: #181818;
    --spotify-gray: #282828;
    --spotify-light-gray: #b3b3b3;
    --spotify-white: #ffffff;
    --spotify-error: #e94560;
    --spotify-success: #2a9d8f;
    --spotify-warning: #f4a261;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    background: linear-gradient(180deg, var(--spotify-black) 0%, var(--spotify-dark) 100%);
    color: var(--spotify-white);
    min-height: 100vh;
    line-height: 1.6;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
  }

  /* Header */
  .header {
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--spotify-gray);
    padding: 20px 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
  }

  .logo {
    font-size: 1.8rem;
    font-weight: bold;
    color: var(--spotify-green);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
    background: var(--spotify-green);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
  }

  .status-bar {
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    color: var(--spotify-light-gray);
  }

  .status-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  .status-dot.online { background: var(--spotify-green); }
  .status-dot.offline { background: var(--spotify-error); }
  .status-dot.running { background: var(--spotify-warning); }

  /* Navigation */
  .nav-container {
    background: var(--spotify-dark);
    border-bottom: 1px solid var(--spotify-gray);
    padding: 15px 0;
    flex-shrink: 0;
  }

  .nav-content {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .nav-item {
    background: var(--spotify-gray);
    border: 1px solid var(--spotify-gray);
    color: var(--spotify-light-gray);
    padding: 10px 20px;
    border-radius: 25px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 500;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-item:hover {
    border-color: var(--spotify-green);
    color: var(--spotify-white);
  }

  .nav-item.active {
    background: var(--spotify-green);
    color: var(--spotify-black);
    border-color: var(--spotify-green);
  }

  /* Main Content */
  .main-content {
    display: grid;
    grid-template-columns: 1fr 350px;
    gap: 20px;
    margin-top: 20px;
  }

  @media (max-width: 1024px) {
    .main-content {
      grid-template-columns: 1fr;
    }
  }

  /* Account Cards */
  .accounts-section {
    background: var(--spotify-dark);
    border-radius: 12px;
    padding: 20px;
    border: 1px solid var(--spotify-gray);
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 1.4rem;
    font-weight: bold;
    color: var(--spotify-white);
  }

  .accounts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 15px;
  }

  @media (max-width: 640px) {
    .accounts-grid {
      grid-template-columns: 1fr;
    }
  }

  .account-card {
    background: var(--spotify-gray);
    border-radius: 12px;
    padding: 20px;
    border: 2px solid transparent;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .account-card:hover {
    border-color: var(--spotify-green);
    transform: translateY(-2px);
  }

  .account-card.running {
    border-color: var(--spotify-warning);
    animation: pulse-border 2s infinite;
  }

  @keyframes pulse-border {
    0%, 100% { border-color: var(--spotify-warning); }
    50% { border-color: var(--spotify-success); }
  }

  .account-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }

  .account-name {
    font-weight: bold;
    font-size: 1.1rem;
    color: var(--spotify-white);
  }

  .account-status {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 500;
  }

  .account-status.active {
    background: rgba(29, 185, 84, 0.2);
    color: var(--spotify-green);
  }

  .account-status.running {
    background: rgba(244, 162, 97, 0.2);
    color: var(--spotify-warning);
  }

  .account-status.loading {
    background: rgba(244, 162, 97, 0.2);
    color: var(--spotify-warning);
    animation: pulse-status 1s infinite;
  }

  .account-status.error {
    background: rgba(233, 69, 96, 0.2);
    color: var(--spotify-error);
  }

  .account-status.offline {
    background: rgba(179, 179, 179, 0.2);
    color: var(--spotify-light-gray);
  }

  @keyframes pulse-status {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .account-info {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 15px;
    font-size: 0.85rem;
    color: var(--spotify-light-gray);
  }

  .account-info div {
    padding: 8px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 6px;
  }

  .account-info label {
    color: var(--spotify-green);
    font-weight: 500;
  }

  .account-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.9rem;
    flex: 1;
    min-width: 80px;
  }

  .btn-primary {
    background: var(--spotify-green);
    color: var(--spotify-black);
  }

  .btn-primary:hover {
    background: #1ed760;
    transform: scale(1.05);
  }

  .btn-secondary {
    background: var(--spotify-blue);
    color: var(--spotify-white);
  }

  .btn-secondary:hover {
    background: #2d4a6f;
  }

  .btn-danger {
    background: var(--spotify-error);
    color: var(--spotify-white);
  }

  .btn-danger:hover {
    background: #f77085;
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* Console */
  .console-section {
    background: var(--spotify-dark);
    border-radius: 12px;
    padding: 20px;
    border: 1px solid var(--spotify-gray);
    height: calc(100vh - 150px);
    display: flex;
    flex-direction: column;
  }

  .console-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }

  .console-output {
    flex: 1;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 8px;
    padding: 15px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 0.85rem;
    overflow-y: auto;
    border: 1px solid var(--spotify-gray);
    max-height: calc(100% - 80px);
  }

  .console-line {
    margin-bottom: 5px;
    line-height: 1.4;
  }

  .console-line.error { color: var(--spotify-error); }
  .console-line.success { color: var(--spotify-green); }
  .console-line.warn { color: var(--spotify-warning); }
  .console-line.info { color: var(--spotify-light-gray); }
  .console-line.account { color: var(--spotify-green); font-weight: bold; }

  /* Progress Bar */
  .progress-container {
    margin-top: 15px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 10px;
    height: 8px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--spotify-green), #2a9d8f);
    border-radius: 10px;
    transition: width 0.3s ease;
  }

  .progress-text {
    text-align: right;
    font-size: 0.8rem;
    color: var(--spotify-light-gray);
    margin-top: 5px;
  }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: var(--spotify-gray);
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid var(--spotify-gray);
  }

  .stat-value {
    font-size: 2rem;
    font-weight: bold;
    color: var(--spotify-green);
    margin-bottom: 5px;
  }

  .stat-label {
    font-size: 0.9rem;
    color: var(--spotify-light-gray);
  }

  /* Global Controls */
  .global-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .control-group {
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--spotify-gray);
    padding: 15px;
    border-radius: 12px;
    flex-wrap: wrap;
  }

  .control-group label {
    font-weight: bold;
    color: var(--spotify-white);
  }

  .control-group select,
  .control-group input {
    background: var(--spotify-black);
    border: 1px solid var(--spotify-gray);
    color: var(--spotify-white);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.9rem;
  }

  /* Page Styles */
  .page {
    display: none;
  }

  .page.active {
    display: block;
  }

  .search-section {
    background: var(--spotify-dark);
    border-radius: 12px;
    padding: 20px;
    border: 1px solid var(--spotify-gray);
  }

  .search-input-container {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .search-input-container input {
    flex: 1;
    background: var(--spotify-gray);
    border: 1px solid var(--spotify-gray);
    color: var(--spotify-white);
    padding: 15px 20px;
    border-radius: 25px;
    font-size: 1rem;
  }

  .search-input-container input:focus {
    outline: none;
    border-color: var(--spotify-green);
  }

  .search-results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 15px;
    max-height: 600px;
    overflow-y: auto;
  }

  .song-card {
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--spotify-gray);
    border-radius: 12px;
    padding: 15px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .song-card:hover {
    border-color: var(--spotify-green);
    transform: translateY(-2px);
    background: rgba(29, 185, 84, 0.1);
  }

  .song-name {
    font-weight: bold;
    color: var(--spotify-white);
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .song-artists {
    color: var(--spotify-light-gray);
    font-size: 0.9rem;
    margin-bottom: 5px;
  }

  .song-album {
    color: var(--spotify-light-gray);
    font-size: 0.85rem;
  }

  .song-duration {
    color: var(--spotify-green);
    font-size: 0.85rem;
    margin-top: 8px;
    font-weight: 500;
  }

  /* Responsive */
  @media (max-width: 640px) {
    .container {
      padding: 10px;
    }

    .header-content {
      flex-direction: column;
      text-align: center;
    }

    .status-bar {
      justify-content: center;
    }

    .console-section {
      height: 400px;
    }

    .global-controls {
      flex-direction: column;
    }

    .control-group {
      flex-direction: column;
      align-items: stretch;
    }

    .nav-content {
      justify-content: center;
    }

    .nav-item {
      flex: 1;
      justify-content: center;
      min-width: 80px;
    }
  }

  /* Scrollbar */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  ::-webkit-scrollbar-track {
    background: var(--spotify-black);
  }

  ::-webkit-scrollbar-thumb {
    background: var(--spotify-gray);
    border-radius: 4px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: var(--spotify-green);
  }
</style>
</head>
<body>
  <div class="header">
    <div class="container">
      <div class="header-content">
        <div class="logo">
          <div class="logo-icon">⚡</div>
          <div>多账号任务平台</div>
        </div>
        <div class="status-bar">
          <div class="status-item">
            <span class="status-dot online"></span>
            <span>在线: <span id="onlineCount">0</span></span>
          </div>
          <div class="status-item">
            <span class="status-dot running"></span>
            <span>运行中: <span id="runningCount">0</span></span>
          </div>
          <div class="status-item">
            <span class="status-dot offline"></span>
            <span>离线: <span id="offlineCount">0</span></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="nav-container">
    <div class="nav-content">
      <div class="nav-item active" data-page="accounts" onclick="showPage('accounts')">
        📋 账号管理
      </div>
      <div class="nav-item" data-page="search" onclick="showPage('search')">
        🔍 搜索
      </div>
    </div>
  </div>

  <div class="container">
    <!-- 账号管理页面 -->
    <div id="page-accounts" class="page active">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="totalTasks">0</div>
          <div class="stat-label">总任务数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="completedTasks">0</div>
          <div class="stat-label">已完成</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="successRate">0%</div>
          <div class="stat-label">成功率</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="avgTime">0s</div>
          <div class="stat-label">平均用时</div>
        </div>
      </div>

      <div class="global-controls">
        <div class="control-group">
          <label>全局操作:</label>
          <button class="btn btn-primary" onclick="startAll()">全部开始</button>
          <button class="btn btn-danger" onclick="stopAll()">全部停止</button>
        </div>
        <div class="control-group">
          <label>并发数:</label>
          <select id="threadCount" onchange="updateThreadCount()">
            <option value="1">1 (单线程)</option>
            <option value="2">2 (低并发)</option>
            <option value="4" selected>4 (标准并发)</option>
            <option value="8">8 (高并发)</option>
            <option value="16">16 (极限并发)</option>
          </select>
        </div>
        <div class="control-group">
          <label>任务类型:</label>
          <select id="taskType">
            <option value="play">播放任务</option>
            <option value="stats">统计任务</option>
            <option value="daily">每日推荐任务</option>
            <option value="custom">自定义任务</option>
          </select>
        </div>
      </div>

      <div class="main-content">
        <div class="accounts-section">
          <div class="section-header">
            <div class="section-title">账号列表</div>
            <button class="btn btn-secondary" onclick="addAccount()">+ 添加账号</button>
          </div>
          <div class="accounts-grid" id="accountsGrid">
            <div class="console-line info">暂无账号，请点击上方"+ 添加账号"开始添加</div>
          </div>
        </div>

        <div class="console-section">
          <div class="console-header">
            <div class="section-title">执行日志</div>
            <button class="btn btn-secondary" onclick="clearConsole()">清空</button>
          </div>
          <div class="console-output" id="consoleOutput">
            <div class="console-line info">🚀 多账号任务执行平台已启动</div>
            <div class="console-line info">📊 支持多线程并发执行</div>
            <div class="console-line info">⚡ 点击上方按钮开始执行任务</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 搜索页面 -->
    <div id="page-search" class="page">
      <div class="search-section">
        <div class="section-header">
          <div class="section-title">🔍 搜索歌曲</div>
        </div>
        <div class="search-input-container">
          <input type="text" id="searchInput" placeholder="输入歌手名或歌曲名..." onkeypress="if(event.key==='Enter')searchSongs()">
          <button class="btn btn-primary" onclick="searchSongs()">搜索</button>
        </div>
        <div class="search-results" id="searchResults">
          <div class="console-line info">输入关键词搜索歌曲...</div>
        </div>
      </div>
    </div>
  </div>

<script>
let accounts = [];

let threadCount = 4;
let currentPage = 'accounts';

function showPage(pageName) {
  currentPage = pageName;

  // 更新导航状态
  document.querySelectorAll('.nav-item').forEach(item => {
    item.classList.remove('active');
    if (item.dataset.page === pageName) {
      item.classList.add('active');
    }
  });

  // 更新页面显示
  document.querySelectorAll('.page').forEach(page => {
    page.classList.remove('active');
  });

  const targetPage = document.getElementById(`page-${pageName}`);
  if (targetPage) {
    targetPage.classList.add('active');
  }

  if (pageName !== currentPage) {
    log(`切换到${pageName === 'accounts' ? '账号管理' : '搜索'}页面`, 'info');
  }
}

function renderAccounts() {
  const grid = document.getElementById('accountsGrid');
  grid.innerHTML = '';

  accounts.forEach(account => {
    const card = document.createElement('div');
    card.className = `account-card ${account.running ? 'running' : ''}`;

    let statusClass, statusText;

    if (account.running) {
      statusClass = 'running';
      statusText = '运行中';
    } else if (account.status === 'loading') {
      statusClass = 'loading';
      statusText = '登录中...';
    } else if (account.status === 'online') {
      statusClass = 'active';
      statusText = '在线';
    } else if (account.status === 'error') {
      statusClass = 'error';
      statusText = '登录失败';
    } else {
      statusClass = 'offline';
      statusText = '离线';
    }

    card.innerHTML = `
      <div class="account-header">
        <div class="account-name">${account.name}</div>
        <div class="account-status ${statusClass}">${statusText}</div>
      </div>
      <div class="account-info">
        <div><label>手机:</label> ${account.phone}</div>
        <div><label>任务:</label> ${account.tasks}</div>
        <div><label>完成:</label> ${account.completed}</div>
        <div><label>成功率:</label> ${account.tasks > 0 ? Math.round((account.completed/account.tasks)*100) : 0}%</div>
      </div>
      ${account.running ? `
        <div class="progress-container">
          <div class="progress-bar" style="width: ${account.progress}%"></div>
        </div>
        <div class="progress-text">${account.progress}%</div>
      ` : ''}
      <div class="account-actions">
        <button class="btn btn-primary" onclick="startTask(${account.id})" ${account.running ? 'disabled' : ''}>开始</button>
        <button class="btn btn-danger" onclick="stopTask(${account.id})" ${!account.running ? 'disabled' : ''}>停止</button>
        <button class="btn btn-secondary" onclick="reloginAccount(${account.id})" ${account.status === 'online' ? 'disabled' : ''}>重登</button>
        <button class="btn btn-danger" onclick="deleteAccount(${account.id})">删除</button>
      </div>
    `;

    grid.appendChild(card);
  });

  updateStats();
}

function updateStats() {
  const online = accounts.filter(a => a.status === 'online').length;
  const running = accounts.filter(a => a.running).length;
  const offline = accounts.filter(a => a.status === 'offline').length;

  const totalTasks = accounts.reduce((sum, a) => sum + a.tasks, 0);
  const completedTasks = accounts.reduce((sum, a) => sum + a.completed, 0);
  const successRate = totalTasks > 0 ? Math.round((completedTasks/totalTasks)*100) : 0;

  document.getElementById('onlineCount').textContent = online;
  document.getElementById('runningCount').textContent = running;
  document.getElementById('offlineCount').textContent = offline;
  document.getElementById('totalTasks').textContent = totalTasks;
  document.getElementById('completedTasks').textContent = completedTasks;
  document.getElementById('successRate').textContent = successRate + '%';
  document.getElementById('avgTime').textContent = (Math.random() * 5 + 2).toFixed(1) + 's';
}

function log(message, type = 'info') {
  const console = document.getElementById('consoleOutput');
  const line = document.createElement('div');
  line.className = `console-line ${type}`;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
  console.appendChild(line);
  console.scrollTop = console.scrollHeight;
}

function addAccount() {
  const phone = prompt('请输入手机号:');
  if (!phone) return;

  const password = prompt('请输入密码:');
  if (!password) return;

  const newId = Math.max(...accounts.map(a => a.id)) + 1;
  accounts.push({
    id: newId,
    name: `账号 ${newId}`,
    phone: phone,
    password: password,
    status: 'offline',
    tasks: 0,
    completed: 0,
    progress: 0,
    running: false
  });
  renderAccounts();
  log(`添加新账号: 账号 ${newId} (${phone})`, 'success');
  loginAccount(newId);
}

function deleteAccount(accountId) {
  if (!confirm('确定要删除这个账号吗？')) return;

  const account = accounts.find(a => a.id === accountId);
  if (account && account.running) {
    alert('账号正在执行任务，请先停止');
    return;
  }

  accounts = accounts.filter(a => a.id !== accountId);
  renderAccounts();
  log(`删除账号: 账号 ${accountId}`, 'warn');
}

function loginAccount(accountId) {
  const account = accounts.find(a => a.id === accountId);
  if (!account) return;

  account.status = 'loading';
  renderAccounts();
  log(`正在登录账号 ${accountId}...`, 'info');

  setTimeout(() => {
    account.status = 'online';
    renderAccounts();
    log(`账号 ${accountId} 登录成功`, 'success');
  }, 2000);
}

function reloginAccount(accountId) {
  const account = accounts.find(a => a.id === accountId);
  if (!account) return;

  if (account.status === 'online') {
    alert('账号已在线');
    return;
  }

  if (account.running) {
    alert('账号正在执行任务，请先停止');
    return;
  }

  loginAccount(accountId);
}

function startTask(accountId) {
  const account = accounts.find(a => a.id === accountId);
  if (account && !account.running) {
    account.running = true;
    account.progress = 0;
    renderAccounts();
    log(`开始执行任务 - ${account.name}`, 'account');
    simulateTask(account);
  }
}

function stopTask(accountId) {
  const account = accounts.find(a => a.id === accountId);
  if (account && account.running) {
    account.running = false;
    account.progress = 0;
    renderAccounts();
    log(`停止任务 - ${account.name}`, 'warn');
  }
}

function simulateTask(account) {
  if (!account.running) return;

  const interval = setInterval(() => {
    if (!account.running) {
      clearInterval(interval);
      return;
    }

    account.progress += Math.random() * 15;

    if (account.progress >= 100) {
      account.progress = 100;
      account.running = false;
      account.tasks++;
      account.completed++;
      clearInterval(interval);
      log(`任务完成 - ${account.name} (成功)`, 'success');
      renderAccounts();
    } else {
      renderAccounts();
    }
  }, 500);
}

function startAll() {
  accounts.forEach(account => {
    if (!account.running && account.status === 'online') {
      startTask(account.id);
    }
  });
}

function stopAll() {
  accounts.forEach(account => {
    stopTask(account.id);
  });
}

function clearConsole() {
  document.getElementById('consoleOutput').innerHTML = '';
  log('控制台已清空', 'info');
}

function updateThreadCount() {
  threadCount = parseInt(document.getElementById('threadCount').value);
  log(`并发数设置为: ${threadCount}`, 'info');
}

function searchSongs() {
  const keyword = document.getElementById('searchInput').value.trim();
  if (!keyword) {
    alert('请输入搜索关键词');
    return;
  }

  const resultsContainer = document.getElementById('searchResults');
  resultsContainer.innerHTML = '<div class="console-line info">正在搜索...</div>';

  // 模拟搜索结果
  setTimeout(() => {
    const mockResults = [
      { id: 1, name: `${keyword} - 示例歌曲1`, artists: '示例歌手1', album: '示例专辑1', duration: 240 },
      { id: 2, name: `${keyword} - 示例歌曲2`, artists: '示例歌手2', album: '示例专辑2', duration: 180 },
      { id: 3, name: `${keyword} - 示例歌曲3`, artists: '示例歌手1', album: '示例专辑3', duration: 210 },
      { id: 4, name: `${keyword} - 示例歌曲4`, artists: '示例歌手3', album: '示例专辑4', duration: 195 },
    ];

    resultsContainer.innerHTML = mockResults.map(song => {
      const minutes = Math.floor(song.duration / 60);
      const seconds = song.duration % 60;
      return `
        <div class="song-card" onclick="playSong(${song.id})">
          <div class="song-name">${song.name}</div>
          <div class="song-artists">${song.artists}</div>
          <div class="song-album">${song.album}</div>
          <div class="song-duration">${minutes}:${seconds.toString().padStart(2, '0')}</div>
        </div>
      `;
    }).join('');

    log(`搜索完成: 找到 ${mockResults.length} 首歌曲`, 'success');
  }, 1000);
}

function playSong(songId) {
  log(`播放歌曲 ID: ${songId}`, 'info');
  log('播放功能需要集成后端 API', 'warn');
}

// 初始化
renderAccounts();
log('系统初始化完成', 'success');
log(`当前并发数: ${threadCount}`, 'info');
</script>
</body>
</html>
